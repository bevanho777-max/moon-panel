<!-- Generated for Moon Panel v0.2.0, MIT licensed.
     Spring meadow under soft sky: pale blue → warm cream gradient,
     low rolling-hill silhouette, layered grass undulations from
     mid-green to deep forest green below the horizon. ~1.2 KB. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8c8e8"/>
      <stop offset="55%" stop-color="#dee8ee"/>
      <stop offset="80%" stop-color="#f0d8b0"/>
      <stop offset="100%" stop-color="#e8b88a"/>
    </linearGradient>
    <linearGradient id="distant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a7e96" stop-opacity="0.7"/>
