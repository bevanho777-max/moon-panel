    </linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ba267"/>
      <stop offset="100%" stop-color="#2a4220"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- Distant rolling hills (low contrast silhouette) -->
  <path d="M 0 720 L 220 600 L 440 680 L 680 560 L 920 660 L 1180 580 L 1420 660 L 1680 560 L 1920 620 L 1920 750 L 0 750 Z"
